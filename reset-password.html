<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ตั้งรหัสผ่านใหม่ · ปลาศาลาหุม</title>
<style>body{margin:0;background:#f4f9f7;color:#173e49;font:18px/1.6 system-ui,sans-serif}main{max-width:520px;margin:8vh auto;padding:32px;background:white;border:1px solid #d4e4df;border-radius:24px}label,input,button{display:block;box-sizing:border-box;width:100%}input{font:inherit;padding:12px;border:1px solid #aac9c1;border-radius:10px;margin:8px 0 20px}button{font:inherit;padding:12px;background:#087b73;color:white;border:0;border-radius:10px;cursor:pointer}button:disabled{opacity:.5}a{color:#087b73}#status{white-space:pre-wrap}@media(max-width:600px){main{margin:24px 16px;padding:24px}}</style></head><body><main><h1>ตั้งรหัสผ่านใหม่</h1><p id="status" role="status" aria-live="polite">กำลังตรวจสอบลิงก์…</p>
<form id="request" hidden><label for="email">อีเมลที่สร้างไว้ในระบบ</label><input id="email" type="email" autocomplete="username" required><button>ส่งลิงก์ตั้งรหัสผ่านใหม่</button></form>
<form id="update" hidden><label for="password">รหัสผ่านใหม่</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">ยืนยันรหัสผ่านใหม่</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button>บันทึกรหัสผ่านใหม่</button></form><p><a href="index.html">กลับหน้าเข้าสู่ระบบ</a></p></main>
<script>window.SPARK=window.SPARK||{};</script><script src="assets/js/database-config.js"></script><script src="assets/js/password-reset.js"></script></body></html>
