<body data-page="cages">
<a class="skip" href="#main">ข้ามไปเนื้อหาหลัก</a>
<aside class="app-sidebar" id="app-sidebar" aria-label="เมนูด้านข้าง">
</aside>
<header class="app-header" id="app-header">
</header>
<main id="main" class="page">
<div class="breadcrumbs">
<a href="index.html">หน้าหลัก</a> / กระชังของกลุ่ม</div>
<div id="connection-notice">
</div>
<div id="role-gate">
</div>
<div class="page-heading">
<div>
<div class="eyebrow">ปลาศาลาหุม · พื้นที่ทดลอง</div>
<h1>กระชังของกลุ่ม</h1>
<p>ช่วยดูแลปลา วางแผนจับ และเชื่อมผู้ซื้อ</p>
</div>
<a class="back-link" href="dashboard.html">← กลับภาพรวม</a>
</div>
<div class="toolbar">
<div class="field">
<label for="search">ค้นหากระชังหรือชนิดปลา</label>
<input id="search" name="search" type="search" value="" >
</div>
<div class="field">
<label for="risk-filter">สถานะ</label>
<select id="risk-filter" name="risk-filter">
<option value="all">ทุกสถานะ</option>
<option value="urgent">เร่งตรวจ</option>
<option value="watch">เฝ้าระวัง</option>
<option value="unknown">ข้อมูลไม่ครบหรือเก่า</option>
<option value="routine">ติดตามตามแผน</option>
</select>
</div>
</div>
<section class="grid two" id="cage-list">
</section>
<section class="card" id="add-cage-section" style="margin-top:24px">
<details>
<summary>+ เพิ่มข้อมูลประจำกระชัง</summary>
<form id="add-cage-form">
<div class="fields">
<div class="field">
<label for="ownerId">ผู้เลี้ยงเจ้าของกระชัง</label>
<select id="ownerId" name="ownerId">
</select>
</div>
<div class="field">
<label for="species">ชนิดปลา</label>
<select id="species" name="species">
<option value="grouper">ปลาเก๋าดอกแดง</option>
<option value="seabass">ปลากะพงสามน้ำ</option>
</select>
</div>
<div class="field">
<label for="count">จำนวนปลาประมาณการ (ตัว)</label>
<input id="count" name="count" type="number" value="" min="1" required inputmode="numeric">
</div>
<div class="field">
<label for="avgKg">น้ำหนักเฉลี่ย (กก./ตัว)</label>
<input id="avgKg" name="avgKg" type="number" value="" min="0.001" step="0.001" required inputmode="decimal">
</div>
<div class="field">
<label for="stage">ระยะเลี้ยง</label>
<input id="stage" name="stage" type="text" value="ระยะขุน" >
</div>
</div>
<div class="form-error" role="alert" hidden>
</div>
<button class="btn" type="submit">เพิ่มกระชัง</button>
</form>
</details>
</section>
<footer class="page-footer">
<span>ปลาศาลาหุม · ต้นแบบสำหรับ SPARK HACK Season 2</span>
<span data-clock>
</span>
</footer>
</main>
<nav class="bottom-nav" id="bottom-nav" aria-label="เมนูมือถือ">
</nav>
</body>
</html>
